<div class="picker" role="radiogroup" aria-label="Conta ou cartão">
  @for (group of groups; track group.label; let i = $index) {
    @let open = isOpen(group.label);
    @let selectedLabel = selectedIn(group);

    <div class="group" [class.group--open]="open">
      <button
        type="button"
        class="group__header"
        [attr.aria-expanded]="open"
        [attr.aria-controls]="panelId(i)"
        (click)="toggleGroup(group.label)"
      >
        <span class="group__chevron material-symbols-rounded" aria-hidden="true">expand_more</span>
        <span class="group__label">{{ group.label }}</span>
        @if (selectedLabel) {
          <span class="group__selected">{{ selectedLabel }}</span>
        } @else {
          <span class="group__count">{{ group.items.length }}</span>
        }
      </button>

      <div class="group__panel" [id]="panelId(i)" [attr.inert]="open ? null : ''">
        <div class="group__grid">
          @for (account of group.items; track account.id) {
            @let selected = value() === account.id;
            <button
              type="button"
              role="radio"
              class="chip"
              [class.chip--selected]="selected"
              [attr.aria-checked]="selected"
              (click)="select(account.id)"
            >
              <app-tile-icon [source]="account" size="sm" [solid]="selected" />
              <span class="chip__label">{{ account.label }}</span>
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>
