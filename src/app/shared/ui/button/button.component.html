<button
  class="btn"
  [class]="'btn--' + variant()"
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() || null"
>
  @if (loading()) {
    <span class="btn__spinner" aria-hidden="true"></span>
  } @else if (icon()) {
    <span class="material-symbols-rounded btn__icon" aria-hidden="true">{{ icon() }}</span>
  }
  <span class="btn__label"><ng-content /></span>
</button>
