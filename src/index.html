<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Meus Gastos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Controle financeiro pessoal no navegador: ganhos, gastos, contas fixas, parcelas e calendário. Sem cadastro, sem servidor.">
  <meta name="author" content="Luiz Henrique Porfírio Santos">
  <meta name="theme-color" content="#f5f4f0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <script>
    // Antes do primeiro pixel: o app só inicia depois, e quem usa escuro veria um flash claro.
    try {
      var raw = localStorage.getItem('gastos:theme');
      var choice = raw ? JSON.parse(raw) : 'system';
      var dark = choice === 'dark'
        || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);

      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (dark) {
        document.querySelector('meta[name="theme-color"]').content = '#131311';
      }
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
